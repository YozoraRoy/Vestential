name: Arena tick (AI Agent 競技場分段收官)

on:
  schedule:
    # 盤前簡報（台灣 09:00）
    - cron: '0 1 * * 1-5'
    # 盤中決策窗 slot0..3（台灣 09:35 / 10:35 / 11:35 / 13:05）
    - cron: '35 1 * * 1-5'
    - cron: '35 2 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '5 5 * * 1-5'
    # 收盤結算（台灣 15:30）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: '分段階段: premarket | slot:N | close | full'
        required: false
        default: 'full'
      force:
        description: '強制重跑該階段 (true)'
        required: false
        default: 'false'

jobs:
  tick:
    runs-on: ubuntu-latest
    # 非同步模式：POST 立即回 jobId → 每 10s 輪詢（上限 150 次 ≈ 25 min）。
    # watchdog 會先把逾時 job 標 failed，故 25 min 內必見 done/failed；30 min 為 GH 層保險。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine phase params
        id: phase
        run: |
          PHASE_INPUT="${{ github.event.inputs.phase }}"
          if [ -n "$PHASE_INPUT" ] && [ "$PHASE_INPUT" != "full" ]; then
            echo "phase=$PHASE_INPUT" >> "$GITHUB_OUTPUT"
          fi
          FORCE_INPUT="${{ github.event.inputs.force }}"
          if [ "$FORCE_INPUT" = "true" ]; then
            echo "force=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger arena tick on Azure (async, returns jobId)
        id: trigger
        run: |
          # Issue #38：不帶 date（由 tick route 以台灣當日解析）。
          # 非交易日 route 回 skipped（不建 job），此處視為成功退出；
          # 需手動回填時用 workflow_dispatch phase + force=true（force=1 可破閘門）。
          QUERY=""
          PHASE="${{ steps.phase.outputs.phase }}"
          FORCE="${{ steps.phase.outputs.force }}"
          # 盤中 cron：依觸發的 cron slot 決定 (無 dispatch phase 時)
          if [ -z "$PHASE" ]; then
            CRON_NAME="${{ github.event.schedule }}"
            case "$CRON_NAME" in
              "0 1 * * 1-5") PHASE="premarket" ;;
              "35 1 * * 1-5") PHASE="slot0" ;;
              "35 2 * * 1-5") PHASE="slot1" ;;
              "35 3 * * 1-5") PHASE="slot2" ;;
              "5 5 * * 1-5") PHASE="slot3" ;;
              "30 7 * * 1-5") PHASE="close" ;;
            esac
          fi
          if [ -n "$PHASE" ]; then
            case "$PHASE" in
              slot0) QUERY="phase=slot&slot=0" ;;
              slot1) QUERY="phase=slot&slot=1" ;;
              slot2) QUERY="phase=slot&slot=2" ;;
              slot3) QUERY="phase=slot&slot=3" ;;
              slot4) QUERY="phase=slot&slot=4" ;;
              slot5) QUERY="phase=slot&slot=5" ;;
              premarket|close) QUERY="phase=${PHASE}" ;;
              full|"") QUERY="" ;;
            esac
          fi
          if [ -n "$FORCE" ]; then
            if [ -n "$QUERY" ]; then QUERY="${QUERY}&force=${FORCE}"; else QUERY="force=${FORCE}"; fi
          fi
          echo "Ticking: $QUERY"
          CODE=$(curl -s -o /tmp/arena_tick.json -w "%{http_code}" \
            --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://vestential.com/api/agent-arena/tick?${QUERY}")
          echo "HTTP $CODE"
          cat /tmp/arena_tick.json
          echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::arena tick POST failed (HTTP $CODE)"
            exit 1
          fi
          SKIPPED=$(jq -r '.skipped // false' /tmp/arena_tick.json)
          if [ "$SKIPPED" = "true" ]; then
            echo "::notice::arena tick skipped (non-trading day): $(jq -c '{roundDate, reason, lastTradingDay}' /tmp/arena_tick.json)"
            exit 0
          fi
          JOB_ID=$(jq -r '.jobId // empty' /tmp/arena_tick.json)
          if [ -z "$JOB_ID" ]; then
            echo "::error::arena tick POST did not return jobId: $(cat /tmp/arena_tick.json)"
            exit 1
          fi
          echo "jobId=$JOB_ID"
          echo "jobId=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Poll arena tick status (10s interval, up to 150)
        if: steps.trigger.outputs.jobId != ''
        run: |
          JOB_ID="${{ steps.trigger.outputs.jobId }}"
          LAST=""
          for i in $(seq 1 150); do
            sleep 10
            LAST=$(curl -s --max-time 30 \
              -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
              "https://vestential.com/api/agent-arena/tick/status?jobId=${JOB_ID}")
            STATUS=$(printf '%s' "$LAST" | jq -r '.status // empty')
            echo "poll#$i status=${STATUS}"
            if [ "$STATUS" = "done" ]; then
              echo "::notice::arena tick done: $(printf '%s' "$LAST" | jq -c '{status, jobId, phase, roundDate, processed: .result.processed, trades: .result.trades, errors: (.result.errors | length // 0)}')"
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "::error::arena tick failed: $LAST"
              exit 1
            fi
          done
          echo "::error::arena tick timed out after 150 polls (~25 min); last=$LAST"
          exit 1