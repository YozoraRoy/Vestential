name: Sync gift data (stock.gift + MOPS)

on:
  schedule:
    # 每日 台灣時間 02:30 (UTC 18:30) — 增量 (missing-only)
    - cron: '30 18 * * *'
    # 每週一 台灣時間 02:30 (UTC 18:30 週一) — 全量重跑一次
    - cron: '30 18 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync stock.gift gifts
        run: npm run sync:stockgift --workspace=packages/database

      - name: Sync MOPS claim rules (official announcements)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "== Monday: full MOPS sync =="
            npm run sync:mops --workspace=packages/database
          else
            echo "== Daily: incremental MOPS sync (missing-only) =="
            npm run sync:mops:missing --workspace=packages/database
          fi
