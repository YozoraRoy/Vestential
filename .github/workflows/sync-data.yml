name: Sync gift data (stock.gift + MOPS)

on:
  schedule:
    # 每日 台灣時間 02:30 (UTC 18:30) — 增量 (missing-only)
    - cron: '30 18 * * *'
    # 每週一 台灣時間 02:30 (UTC 18:30 週一) — 全量重跑一次
    - cron: '30 18 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Load DATABASE_URL from Azure Key Vault
        run: |
          DATABASE_URL=$(az keyvault secret show \
            --vault-name kv-aicontrol-roy \
            --name VESTENTIAL-DATABASE-URL \
            --query value -o tsv)
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Failed to load VESTENTIAL-DATABASE-URL from Azure Key Vault kv-aicontrol-roy"
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync stock.gift gifts
        run: npm run sync:stockgift --workspace=packages/database

      - name: Sync MOPS claim rules (official announcements)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "== Monday: full MOPS sync =="
            npm run sync:mops --workspace=packages/database
          else
            echo "== Daily: incremental MOPS sync (missing-only) =="
            npm run sync:mops:missing --workspace=packages/database
          fi
