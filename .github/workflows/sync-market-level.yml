name: Sync Market Level (TWSE TAIEX & BWIBBU)

on:
  schedule:
    # 每天台灣上班時間（週一至週五）下午 13:30 (UTC 05:30)，剛好在台股收盤後第一時間啟動同步
    - cron: '30 5 * * 1-5'
    # 每天台灣上班時間（週一至週五）下午 15:30 (UTC 07:30)，TWSE 盤後完整個股估值 (BWIBBU_d) 結算後二次校準
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trigger market-level refresh on Azure
        run: |
          echo "Triggering market level sync at $(date -u)"
          CODE=$(curl -s -o /tmp/market_level_resp.json -w "%{http_code}" \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://vestential.com/api/market-level")
          echo "HTTP $CODE"
          cat /tmp/market_level_resp.json
          echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::market-level sync failed (HTTP $CODE)"
            exit 1
          fi
