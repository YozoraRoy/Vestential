name: Typecheck

# Issue #68 防漏網：main 分支 typecheck 曾因 stale dist 紅燈
#（apps/web 經 @stock/database 解析到 gitignored 的 tsup 產物，
# 本地 dist 過期即 TS2305），且只跑 typecheck 不先 build 就會重現。
# 此 job 先建依賴 workspaces 再全量 typecheck；web tsc 需約 6GB 堆
#（預設堆會 OOM exit 134，見 apps/web package.json typecheck）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies (avoid stale dist)
        run: npm run build --workspace=packages/core && npm run build --workspace=packages/market-data && npm run build --workspace=packages/database && npm run build --workspace=packages/ai-engine

      - name: Typecheck all workspaces
        run: npm run typecheck
