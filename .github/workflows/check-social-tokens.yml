name: Check Social Tokens

on:
  schedule:
    # 每天 TW 03:30 = UTC 19:30
    - cron: "30 19 * * *"
  workflow_dispatch:

concurrency:
  group: social-token-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping token-health endpoint
        run: |
          CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            "https://vestential.com/api/social/token-health")
          echo "token-health HTTP $CODE"
          echo "---"
          cat /tmp/health.json
          if [ "$CODE" != "200" ]; then
            echo "::error::token-health check failed (HTTP $CODE)"
            exit 1
          fi
          echo "---"
          echo "Broken/inaccessible token triggers email alert server-side."