name: Sync market focus (AI-filtered news)

on:
  # 2026-10-22：排程已移到 Azure Logic App（logic-market-focus-scheduler，
  # 01:00/09:00/13:00/19:00 TW）。這裡只保留手動補跑，勿把 cron 加回來，
  # 否則會與 Logic App 重複觸發（GitHub 排程實測延遲 1.5–4.8 小時）。
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Trigger market-focus refresh (background job)
        id: trigger
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # 2026-10-22 15:45Z run 39807792120 因 runner DNS 解析失敗（curl exit 6）直接掛掉，
          # 且 `CODE=$(curl ...)` 在 bash -e 下會讓 step 靜默中止、log 只剩 exit 6。
          # 這裡對「請求尚未送出」的連線類錯誤（5/6/7）重試，並把 curl exit 明確印出來。
          CODE=""
          CURL_EXIT=0
          for attempt in 1 2 3 4; do
            if CODE=$(curl -s -o /tmp/mf_resp.json -w "%{http_code}" \
              --max-time 60 \
              -X POST \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              -H "Content-Type: application/json" \
              "https://vestential.com/api/market-focus/refresh"); then
              CURL_EXIT=0
              break
            else
              CURL_EXIT=$?
            fi

            # 5/6/7 = proxy/DNS/連線失敗，請求尚未送出，可安全重試。
            # 其餘（例如 28 timeout）可能已送出，重試恐重複建立 job，因此不重試。
            case "$CURL_EXIT" in
              5|6|7)
                if [ "$attempt" -lt 4 ]; then
                  echo "attempt $attempt: curl exit $CURL_EXIT (DNS/connect), retrying in 10s..."
                  sleep 10
                else
                  echo "attempt $attempt: curl exit $CURL_EXIT (DNS/connect), giving up"
                fi
                ;;
              *)
                echo "attempt $attempt: curl exit $CURL_EXIT (not retryable)"
                break
                ;;
            esac
          done

          echo "HTTP $CODE (curl exit $CURL_EXIT)"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::market-focus refresh trigger network failure (curl exit $CURL_EXIT)"
            exit 1
          fi

          cat /tmp/mf_resp.json
          echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::market-focus refresh trigger failed (HTTP $CODE)"
            exit 1
          fi
          JOB_ID=$(python3 -c "import sys,json;d=json.load(open('/tmp/mf_resp.json'));print(d.get('jobId',''))")
          if [ -z "$JOB_ID" ]; then
            echo "::error::no jobId in response"
            exit 1
          fi
          echo "job-id=$JOB_ID"
          echo "jobId=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for market-focus job completion
        id: wait
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          JOB_ID: ${{ steps.trigger.outputs.jobId }}
        run: |
          # 後台 job 最長 25 分鐘；輪詢 160 次 × 10s ≈ 27 分鐘，涵蓋完整 job 生命週期
          for i in $(seq 1 160); do
            CODE=$(curl -s -o /tmp/mf_status.json -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              "https://vestential.com/api/market-focus/refresh/status?jobId=$JOB_ID" || echo "000")
            if [ "$CODE" != "200" ]; then
              echo "attempt $i -> HTTP $CODE (retrying)"
              sleep 10
              continue
            fi
            STATUS=$(python3 -c "import sys,json;d=json.load(open('/tmp/mf_status.json'));j=d.get('job',{});print(j.get('status',''))")
            STAGE=$(python3 -c "import sys,json;d=json.load(open('/tmp/mf_status.json'));j=d.get('job',{});print(j.get('stage') or '')")
            echo "attempt $i -> status=$STATUS stage=$STAGE"
            if [ "$STATUS" = "done" ]; then
              python3 -c "import sys,json;d=json.load(open('/tmp/mf_status.json'));j=d['job'];print(json.dumps({'count':j.get('count'),'editionKey':j.get('editionKey'),'social':j.get('socialResults')},ensure_ascii=False))"
              echo "::notice::market-focus refresh completed"
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              FAIL_MSG=$(python3 -c "import sys,json;d=json.load(open('/tmp/mf_status.json'));print(d['job'].get('error',''))")
              echo "::error::market-focus refresh failed: $FAIL_MSG"
              echo "--- full job payload ---"
              cat /tmp/mf_status.json
              exit 1
            fi
            sleep 10
          done
          echo "::error::market-focus refresh timed out waiting for job"
          echo "--- last status payload ---"
          cat /tmp/mf_status.json
          exit 1
