name: Sync odd-lot trades (TWSE TWT53U)

on:
  schedule:
    # 每週一至五 台灣時間 15:10 (UTC 07:10)，TWSE 盤後零股約 15:00 公布後抓取
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compute Taiwan trading date (Asia/Taipei)
        id: date
        run: |
          # 以 Asia/Taipei 時區計算「今天」；若為六日則回推到最近交易日。
          TODAY=$(TZ='Asia/Taipei' date +%Y%m%d)
          DOW=$(TZ='Asia/Taipei' date +%u)
          if [ "$DOW" = "6" ]; then
            TARGET=$(TZ='Asia/Taipei' date -d '-1 day' +%Y%m%d)
          elif [ "$DOW" = "7" ]; then
            TARGET=$(TZ='Asia/Taipei' date -d '-2 day' +%Y%m%d)
          else
            TARGET=$TODAY
          fi
          echo "target=$TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Trigger odd-lot refresh on Azure
        run: |
          echo "Refreshing odd-lot for ${{ steps.date.outputs.target }}"
          CODE=$(curl -s -o /tmp/oddlot_resp.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://vestential.com/api/odd-lot/refresh?date=${{ steps.date.outputs.target }}")
          echo "HTTP $CODE"
          cat /tmp/oddlot_resp.json
          echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::odd-lot refresh failed (HTTP $CODE)"
            exit 1
          fi
